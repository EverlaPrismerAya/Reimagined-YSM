tasks.register('checkYsmPhysics', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'net.everla.ysmPhysLib.PhysCheck'
    systemProperty 'ysm.physicsExample', rootProject.file('docs/examples/ysmPhys-demo').absolutePath
    if (project.hasProperty('physicsModel')) systemProperty 'ysm.physicsModel', project.property('physicsModel')
    enableAssertions = true
    jvmArgs '-Djava.awt.headless=true'
}

tasks.named('check') { dependsOn 'checkYsmPhysics' }

// Opt-in hardware check: no display/GL dependency is added to the normal check task or release JAR.
configurations { physicsGpuNatives }
def physicsNativeOs = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('win') ? 'windows' : 'linux'
dependencies {
    physicsGpuNatives "org.lwjgl:lwjgl:3.3.1:natives-${physicsNativeOs}"
    physicsGpuNatives "org.lwjgl:lwjgl-glfw:3.3.1:natives-${physicsNativeOs}"
    physicsGpuNatives "org.lwjgl:lwjgl-opengl:3.3.1:natives-${physicsNativeOs}"
}
tasks.register('checkYsmGpuPhysics', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath + configurations.physicsGpuNatives
    mainClass = 'net.everla.ysmPhysLib.GpuPhysCheck'
    enableAssertions = true
    systemProperty 'ysm.physicsExample', rootProject.file('docs/examples/ysmPhys-demo').absolutePath
    if (project.hasProperty('physicsBenchmark')) systemProperty 'ysm.physicsBenchmark', 'true'
    if (project.hasProperty('physicsCase')) systemProperty 'ysm.physicsCase', project.property('physicsCase')
    if (project.hasProperty('physicsModel')) systemProperty 'ysm.physicsModel', project.property('physicsModel')
}

// Explicit development-only client probe travels through the same Architectury
// transformed module as production classes, avoiding Forge split-package modules.
if (project.hasProperty('physicsClientProbe')) {
    if (gradle.startParameter.taskNames.any { it.tokenize(':').last() ==~ /build|assemble|shadowJar|remapJar|publish.*/ })
        throw new GradleException('Do not build release artifacts with -PphysicsClientProbe; run the client probe separately.')
    tasks.named('jar') { dependsOn testClasses; from sourceSets.test.output }
}

// Optional -PofficialYsmJar points to the unmodified 2.6.5 Forge release for bytecode comparison.
tasks.register('checkOfficialProtocol', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'com.elfmcys.yesstevemodel.client.OfficialProtocolCheck'
    enableAssertions = true
    systemProperty 'ysm.protocolFixtures', file('src/test/resources/official-ysm-2.6.5').absolutePath
    if (project.hasProperty('officialYsmJar')) systemProperty 'ysm.officialJar', rootProject.file(project.property('officialYsmJar')).absolutePath
    if (project.hasProperty('writeProtocolFixtures')) systemProperty 'ysm.writeProtocolFixtures', 'true'
}
tasks.named('check') { dependsOn 'checkOfficialProtocol' }
