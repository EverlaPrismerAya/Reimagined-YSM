architectury {
    common rootProject.enabled_platforms.split(',')
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    implementation "org.mozilla:rhino:1.7.15"
    implementation "org.apache.commons:commons-compress:1.26.2"
    implementation "org.tukaani:xz:1.9"
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API common artifact — 提供 Event<>、ClientLifecycleEvent、PlayerEvent 等抽象事件类型。
    modCompileOnly "dev.architectury:architectury:$rootProject.architectury_api_version"

    // Forge Config API Port — 让 common 在编译期看到 net.minecraftforge.common.ForgeConfigSpec 等类。
    // 运行时不绑定：Forge 平台由 Forge 自身提供这些类，Fabric 平台由 fabric 子项目的 modImplementation 引入 port。
    modCompileOnly "maven.modrinth:forge-config-api-port:$rootProject.forge_config_api_port_version"

    // ImageStream — 用于 avif/webp/jpeg 解码。运行时由 forge 子项目通过 jar-in-jar 内嵌。
    compileOnly "com.github.TartaricAlkaline:ImageStream:-SNAPSHOT"
}

tasks.register('compileNative') {
    if (true) { // TODO
        return false
    }
    def osName = System.getProperty("os.name").toLowerCase(Locale.ROOT)
    def isWindows = osName.contains("win")
    def isLinux = osName.contains("linux")
    def isMac = osName.contains("mac")
    def isCI = System.getenv("GITHUB_ACTIONS") == "true"

    def generatedBase = file("src/generated/resources/META-INF/native")
    def cmake = isWindows ? "cmake.exe" : "cmake"
    if (!isCI && isMac) cmake = "/opt/local/bin/cmake"

    inputs.dir("src/main/native")
    outputs.dir(generatedBase)

    onlyIf {
        try {
            return [cmake, "--version"].execute().waitFor() == 0
        } catch (ignored) {
            println "CMake not found."
            return false
        }
    }

    doLast {
        def configs
        if (isWindows) configs = [[arch: "x64", folder: "windows-x64"], [arch: "Win32", folder: "windows-x86"]]
        else if (isMac) configs = [[arch: "x86_64", folder: "macos-x64"], [arch: "arm64", folder: "macos-arm64"]]
        else if (isLinux) configs = [[arch: "x64", folder: "linux-x64"]]
        else configs = []

        def libName = isWindows ? "ysm-core.dll" : (isMac ? "libysm-core.dylib" : "libysm-core.so")

        configs.each { conf ->
            def buildDir = file("${project.buildDir}/cmake-temp/${conf.folder}")
            def targetDir = file("${generatedBase}/${conf.folder}")
            buildDir.mkdirs()

            def configArgs = [cmake, "-S", projectDir.absolutePath, "-B", buildDir.absolutePath, "-DCMAKE_BUILD_TYPE=Release"]
            if (isWindows) {
                if (isCI) configArgs += ["-G", "Visual Studio 17 2022"]
                configArgs += ["-A", conf.arch]
            } else if (isMac) {
                configArgs += "-DCMAKE_OSX_ARCHITECTURES=${conf.arch}"
            }
            exec { commandLine configArgs }

            exec { commandLine cmake, "--build", buildDir.absolutePath, "--config", "Release" }

            def builtFile = isWindows ? file("${buildDir}/Release/${libName}") : file("${buildDir}/${libName}")
            if (!builtFile.exists()) throw new GradleException("File not found: ${builtFile}")

            targetDir.mkdirs()
            copy {
                from builtFile
                into targetDir
            }
        }
    }
}

processResources.dependsOn compileNative

tasks.register('scriptChecks', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'net.everla.ysmJsLib.ScriptChecks'
    workingDir rootProject.projectDir
    if (project.hasProperty('scriptGpu')) {
        classpath += configurations.detachedConfiguration(dependencies.create('org.lwjgl:lwjgl:3.3.1:natives-windows'), dependencies.create('org.lwjgl:lwjgl-glfw:3.3.1:natives-windows'), dependencies.create('org.lwjgl:lwjgl-opengl:3.3.1:natives-windows'))
    }
    if (project.hasProperty('scriptExamples')) args rootProject.file('examples/rysmjs').absolutePath
    if (project.hasProperty('scriptGpu')) args '--gpu'
}

tasks.register('scriptMemoryChecks', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'net.everla.ysmJsLib.ScriptMemoryChecks'
    workingDir rootProject.projectDir
    maxHeapSize = '96m'
}

tasks.register('modelLoadingChecks', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'net.everla.ysmJsLib.ModelLoadingChecks'
    workingDir rootProject.projectDir
    maxHeapSize = '512m'
    if (project.hasProperty('modelLog')) args project.property('modelLog')
}

// Official YSM is the sole source of builtin models.
tasks.withType(ProcessResources).configureEach {
    exclude 'assets/yes_steve_model/builtin/**'
}
